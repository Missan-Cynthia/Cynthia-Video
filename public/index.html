<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><meta name="apple-mobile-web-app-title" content="Youtube"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>Youtube · v15</title></head><body>
<header class="topbar"><div class="brand-group"><button id="menu" class="icon-button" aria-label="切換導覽列">☰</button><a href="./" class="brand" aria-label="YouTube 首頁"><span class="logo-mark">▶</span>YouTube<sup>TW</sup></a></div><form id="searchForm" role="search"><input id="search" type="search" placeholder="搜尋" aria-label="搜尋你的影片" autocomplete="off"><button aria-label="搜尋影片"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button></form><button id="parent" class="avatar" aria-label="家長專區" title="家長專區">家</button></header>
<aside id="sidebar" aria-label="主要導覽"><nav><button id="home" class="nav-item active"><span data-icon="home"></span><span>首頁</span></button><button id="favorites" class="nav-item"><span data-icon="heart"></span><span>收藏影片</span></button><button id="downloads" class="nav-item"><span data-icon="download"></span><span>已下載</span></button><hr><button id="sync" class="nav-item"><span data-icon="refresh"></span><span>更新影片</span></button><button id="install" class="nav-item" hidden><span data-icon="plus"></span><span>安裝應用程式</span></button></nav><div class="sidebar-note">你的影片，你的頻道。<br>KidsTube · 家庭片庫 · v15</div></aside>
<main><nav class="chips" aria-label="篩選影片"><button id="all" class="selected">全部</button><button id="recent">最新上傳</button><button id="offline">已下載</button></nav><p id="status" role="status" aria-live="polite">正在同步影片…</p><h1 id="viewTitle" class="sr-only">推薦影片</h1><section id="grid" aria-label="影片清單"></section><div id="endLoader" class="end-loader" aria-label="影片加載中"><span class="spinner" aria-hidden="true"></span><span>影片加載中</span></div></main>
<dialog id="player"><div class="watch-toolbar"><a class="brand" href="./" aria-label="YouTube 首頁"><span class="logo-mark">▶</span>YouTube</a><button id="closePlayer" class="icon-button" aria-label="關閉播放器">✕</button></div><div class="watch-layout"><section><video id="video" controls playsinline preload="metadata"></video><h2 id="playing"></h2><div class="watch-info"><span class="channel-avatar">K</span><div><b>家庭頻道</b><small>只播放家長加入的影片</small></div><button id="favoritePlaying">收藏影片</button></div><p id="playStatus" role="status"></p></section><aside><h3>接下來看什麼</h3><div id="recommendations"></div></aside></div></dialog>
<dialog id="admin"><button id="closeAdmin">關閉 ✕</button><h2>家長管理</h2><p id="adminDescription">影片僅限自製或已取得可供此平台播放、儲存的授權。</p><form id="login"><label id="emailLabel" hidden>電子郵件<input id="email" type="email" autocomplete="username" maxlength="254"></label><label id="passwordLabel">家長密碼<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>解鎖管理</button></form>
<section id="management" hidden><button id="logout">登出並上鎖</button><div id="cloudManagement" hidden><p id="cloudAccount"></p><p id="cloudUid"></p><button id="cloudRefresh">重新同步片單</button><p>新增、刪除與上傳影片請使用 Firebase Storage 控制台。此 App 僅可讀取。</p><details><summary>目前 Storage 實際檔案路徑</summary><pre id="cloudPaths"></pre></details></div><div id="localManagement"><h3>新增 MP4</h3><form id="upload"><label>影片名稱<input id="title" maxlength="100" required></label><label>來源／授權範圍與有效期<input id="rights" maxlength="500" required placeholder="例如：本人自製；或授權方、離線權利、到期日"></label><label>MP4 檔案<input id="file" type="file" accept="video/mp4,.mp4" required></label><button id="uploadButton">上傳影片</button></form><progress id="progress" max="100" value="0" hidden></progress><p>下載時請保持 App 在前景；完成後再切換飛航模式測試。</p><div id="adminList"></div><p id="storage"></p></div></section><p id="adminStatus" role="status" aria-live="polite"></p></dialog>
<script src="./firebase-settings.js?v=15" defer></script><script src="./firebase-shared.js?v=15" defer></script><script src="./app.js?v=15" defer></script></body></html>
